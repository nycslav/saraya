services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: saraya
      POSTGRES_USER: saraya
      POSTGRES_PASSWORD: saraya
    ports:
      - "5432:5432"
    volumes:
      - saraya_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saraya -d saraya"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - saraya_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  saraya_postgres_data:
  saraya_redis_data:

